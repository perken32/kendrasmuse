<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kendrasmuse</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet" />

<style>
  body {
    margin: 0;
    padding: 3rem 1.2rem;
    background-color: #fffdfc;
    color: #5c3a45;
    font-family: 'Cormorant Garamond', serif;
    line-height: 1.8;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  header {
    max-width: 720px;
    width: 100%;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 2.6rem;
    letter-spacing: 2px;
    margin-bottom: 1rem;
    color: #5c3a45;
    font-weight: 600;
  }

  .quote {
    font-size: 1.55rem;
    color: #8a5a6a;
    font-style: italic;
    margin-bottom: 2rem;
  }

  .divider {
    width: 100%;
    max-width: 720px;
    height: 1px;
    background: linear-gradient(to right, transparent, #efd3dc, transparent);
    margin: 2.5rem 0;
  }

  section {
    max-width: 720px;
    width: 100%;
    margin-bottom: 2.5rem;
  }

  h2 {
    font-size: 1.25rem;
    color: #6a4a57;
    margin-bottom: 1rem;
    font-weight: 600;
  }

  iframe {
    width: 100%;
    max-width: 720px;
    height: 400px;
    border-radius: 14px;
    border: none;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 1.2rem;
    flex-wrap: wrap;
  }

  .socials a {
    color: #6a4a57;
    text-decoration: none;
    font-size: 1rem;
    transition: color 0.3s ease;
  }

  .socials a:hover {
    color: #d9a6b8;
  }

  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: #b08a98;
  }
</style>
</head>

<body>

<header>
  <h1>kendrasmuse</h1>

  <div class="quote">
    “The moment of truth speaks through clarity and peace.”
  </div>
</header>

<div class="divider"></div>

<section>
  <h2>Muse Reflections</h2>

  <iframe src="https://www.youtube.com/embed/" allowfullscreen></iframe>
</section>

<div class="divider"></div>

<section>
  <h2>Connect</h2>

  <div class="socials">
    <a href="https://substack.com/@kendrasmuse" target="_blank">Substack</a>
    <a href="https://youtube.com/@kendrasmuse" target="_blank">YouTube</a>
    <a href="https://tiktok.com/@kendrasmuse" target="_blank">TikTok</a>
    <a href="https://www.facebook.com/share/1HVLorJFz9/?mibextid=wwXIfr" target="_blank">Facebook</a>
  </div>
</section>

<footer>
  © 2025 kendrasmuse
</footer>

</body>
</html>
